baseURL = "https://ajossorio.ar/"
title = "A.J. Ossorio Arana"
defaultContentLanguage = "en"

[taxonomies]
  coordinate = "coordinates"

[params]
  math = true  # Enables KaTeX site-wide by default
  favicon = "logo_ocre-cropped.svg"
  share_image = "logo_ocre_1.png"

[languages]
  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 1
    [languages.en.params]
      location = "Northern Patagonia, Argentina"
      archiveTitle = "Writings"

  [languages.es]
    locale = "es-AR"
    label = "Español"
    weight = 2
    [languages.es.params]
      location = "San Martín de los Andes, Patagonia"
      archiveTitle = "Escritos"